<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Memorial Board</title>
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@5.3.0/dist/bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --rotation: 90deg; 
            --safe-width: 90vw;
            --safe-height: 90vh;
            --cols: 3; 
            --rows: 7;
            --gap: 15px; 
            --plaque-font-size: 16px; 
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #000; color: #000; 
            font-family: 'Assistant', sans-serif; 
            overflow: hidden; 
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none; 
        }

        .rotation-wrapper {
            width: var(--safe-height); 
            height: var(--safe-width);
            transform: rotate(var(--rotation));
            display: flex;
            overflow: hidden;
            background: #000;
            position: relative; 
        }
        
        .sidebar { 
            width: 250px; 
            background-color: #000; 
            border-right: 4px solid #b8860b; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 5px 0 20px rgba(0,0,0,0.9); 
            z-index: 10; 
            flex-shrink: 0;
            padding: 20px 20px 20px 10px; 
            box-sizing: border-box;
        }
        
        .candle-container { position: relative; width: 60px; height: 180px; margin-top: 10px; }
        .candle-body { width: 100%; height: 100%; background: linear-gradient(to right, #e6b85c, #ffefc2, #e6b85c); border-radius: 4px; box-shadow: inset -5px 0 10px rgba(0,0,0,0.4); opacity: 0.9; position: relative; z-index: 1; }
        .wick { width: 4px; height: 15px; background: #333; margin: 0 auto; position: relative; top: -15px; z-index: 2; }
        
        .flame { 
            width: 18px; height: 60px; 
            background: radial-gradient(ellipse at center, white 5%, #ffcc00 30%, #ff4500 85%); 
            border-radius: 50% 50% 20% 20%; 
            margin: -255px auto 0; 
            box-shadow: 0 0 20px #ff4500, 0 0 40px #ff8c00; 
            animation: flicker 0.1s infinite alternate; 
            transform-origin: bottom center;
            position: relative; z-index: 3; 
        }
        @keyframes flicker { 0% { transform: scale(1) rotate(-1deg); opacity: 0.95; } 100% { transform: scale(1.04) rotate(1deg); opacity: 1; } }

        .memorial-text { 
            color: #d4af37; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-top: 30px; 
            text-align: center; 
            font-family: 'Frank Ruhl Libre', serif; 
            line-height: 1.5; 
        }

        .live-clock {
            margin-top: 40px;
            text-align: center;
            width: 100%;
        }
        .clock-time {
            color: #d4af37;
            font-family: 'Assistant', sans-serif;
            font-size: 2.8em; 
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 15px; 
        }
        .clock-date-en {
            color: #cfaa60;
            font-family: 'Assistant', sans-serif;
            font-size: 1.3em; 
            margin-bottom: 10px; 
        }
        .clock-date-heb {
            color: #cfaa60;
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.5em; 
            font-weight: 700;
            direction: rtl;
        }

        .main-content { flex: 1; padding: 0 0 0 20px; overflow-y: hidden; display: flex; flex-direction: column; }
        
        .header-info { 
            color: #d4af37; 
            text-align: center; 
            font-size: 1.6em; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
            font-family: 'Frank Ruhl Libre', serif; 
            flex-shrink: 0; 
            line-height: 1.3;
        }
        
        .hebrew-date-line { display: block; margin-top: 6px; font-size: 1.1em; font-weight: bold; direction: rtl; }

        .grid-viewport {
            flex: 1; 
            overflow-y: hidden; 
            scroll-behavior: smooth;
            position: relative;
            scroll-snap-type: y mandatory;
        }

        .page-container {
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); 
            gap: var(--gap);
            padding-bottom: 20px; 
            box-sizing: border-box;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
        
        .plaque { 
            background: linear-gradient(135deg, #cfaa60 0%, #f3e5ab 40%, #cfaa60 100%); 
            border: 2px solid #8a6e2f; 
            border-radius: 2px; 
            /* Optimized padding: gives room for larger text without touching borders */
            padding: 8px; 
            box-shadow: inset 0 0 20px rgba(255,255,255,0.3), 0 5px 10px rgba(0,0,0,0.8); 
            display: flex; flex-direction: column; height: 100%; box-sizing: border-box; position: relative; text-align: center; 
            font-size: var(--plaque-font-size);
            overflow: hidden;
            min-height: 0; 
        }
        .plaque::after { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 1px solid rgba(0,0,0,0.15); pointer-events: none; }
        
        /* --- FONT SIZES INCREASED --- */
        .plaque-zone-top { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 0; overflow: hidden; }
        .hebrew-name { 
            font-family: 'Frank Ruhl Libre', serif; font-weight: 700; 
            font-size: 1.4em; /* Increased for better legibility */
            color: #1a1a1a; direction: rtl; width: 100%; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .plaque-zone-mid { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 0; overflow: hidden; }
        .english-name { 
            font-family: 'Assistant', sans-serif; font-weight: 800; 
            font-size: 1.3em; /* Increased for prominent display */
            text-transform: uppercase; color: #000; letter-spacing: 0.5px; line-height: 1.1; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%; 
        }

        .plaque-zone-bot { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; box-sizing: border-box; min-height: 0; overflow: hidden; }
        .footer-text { 
            font-size: 0.85em; /* Scaled up to match new proportions */
            font-weight: 700; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .date-left { text-align: left; padding-right: 5px; }
        .date-right { text-align: right; direction: rtl; padding-left: 5px; }
        
        .loading { color: #d4af37; text-align: center; font-size: 1.5em; margin-top: 50px; width: 100%; }
        .error-message { color: #ff6b6b; font-family: monospace; text-align: left; padding: 20px; background: rgba(50,0,0,0.8); border: 1px solid red; white-space: pre-wrap; margin: 20px; border-radius: 8px; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="rotation-wrapper">
        <div class="sidebar">
            <div class="candle-container"><div class="wick"></div><div class="candle-body"></div><div class="flame"></div></div>
            
            <div class="memorial-text">In Loving<br>Memory<br>זכרון עולם</div>

            <div class="live-clock">
                <div id="time-display" class="clock-time">00:00:00</div>
                <div id="en-date-display" class="clock-date-en">--/--/----</div>
                <div id="heb-date-display" class="clock-date-heb">-- -- --</div>
            </div>
        </div>

        <div class="main-content">
            <div class="header-info" id="date-display">Initializing Board...</div>
            <div class="grid-viewport" id="viewport">
                <div class="loading">Loading Memorials...</div>
            </div>
        </div>
    </div>

    <script>
        // --- SETTINGS ---
        const SHEET_ID = "2PACX-1vQiZ-4k29re4CrRPPu9Nm7ZavFMDqbOlY5I07ktxe-ExPsfyxsaQuOBKTPP7_HyLU-2AcSRH_4TkPQP";
        
        const SAFE_SCALE = 0.90; 
        const ROWS_PER_PAGE = 10;   
        const COLS_PER_PAGE = 3;   
        // ----------------

        let scrollInterval = null;
        let pageIndex = 0; 

        async function fetchSpreadsheetData() {
            const cacheKey = 'memorialBoardCache';
            const cacheTimeKey = 'memorialBoardCacheTime';
            const now = new Date().getTime();
            
            const directUrl = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=0&single=true&output=csv&t=${now}`;
            const proxyUrl1 = `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`;
            const proxyUrl2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;
            
            const urlsToTry = [directUrl, proxyUrl1, proxyUrl2];

            for (let url of urlsToTry) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); 
                    
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const csvText = await response.text();
                        localStorage.setItem(cacheKey, csvText);
                        localStorage.setItem(cacheTimeKey, now.toString());
                        return csvText;
                    }
                } catch (error) {
                    console.warn(`Connection failed for URL: ${url}. Trying next...`);
                }
            }

            const savedData = localStorage.getItem(cacheKey);
            if (savedData) {
                console.log("Internet/Servers down. Loading board from offline cache.");
                return savedData;
            }

            throw new Error("Could not connect to Google Sheets, and no offline backup exists. Please check internet connection.");
        }

        function updateClock() {
            const now = new Date();
            
            const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('time-display').innerText = timeStr;
            
            const enDateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            document.getElementById('en-date-display').innerText = enDateStr;
            
            const hDate = new hebcal.HDate(now);
            const hDayStr = rowToHebrew(hDate.getDate());
            const hMonthStr = translateMonth(hDate.getMonthName());
            const hYearStr = yearToHebrew(hDate.getFullYear());
            
            document.getElementById('heb-date-display').innerText = `${hDayStr} ${hMonthStr} ${hYearStr}`;
        }

        async function initBoard() {
            try {
                if (scrollInterval) clearInterval(scrollInterval);
                
                calculateLayout(); 

                const csvText = await fetchSpreadsheetData();
                const results = Papa.parse(csvText, { header: true, skipEmptyLines: true });
                const data = results.data;

                if (data.length > 0) {
                    const keys = Object.keys(data[0]);
                    if (!keys.includes('HebrewDate') && (!keys.includes('HebrewDay') || !keys.includes('HebrewMonth'))) {
                        throw new Error(`MISSING COLUMNS: Your spreadsheet must have either a 'HebrewDate' column OR 'HebrewDay' and 'HebrewMonth' columns.`);
                    }
                }

                const today = new Date();
                const dayOfWeek = today.getDay(); 
                const currentHour = today.getHours();
                
                let daysToSubtract = 0;
                
                if (dayOfWeek === 6) {
                    daysToSubtract = 0;
                } else if (dayOfWeek === 5 && currentHour >= 14) {
                    daysToSubtract = -1;
                } else {
                    daysToSubtract = dayOfWeek + 1;
                }

                const startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - daysToSubtract);
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                const enFormat = { day: '2-digit', month: '2-digit', year: 'numeric' };
                const dateRangeEn = `${startOfWeek.toLocaleDateString('en-GB', enFormat)} - ${endOfWeek.toLocaleDateString('en-GB', enFormat)}`;
                
                const hDateStart = new hebcal.HDate(startOfWeek);
                const hDateEnd = new hebcal.HDate(endOfWeek);
                const hStartStr = `${rowToHebrew(hDateStart.getDate())} ${translateMonth(hDateStart.getMonthName())}`;
                const hEndStr = `${rowToHebrew(hDateEnd.getDate())} ${translateMonth(hDateEnd.getMonthName())}`;
                const dateRangeHeb = `${hStartStr} - ${hEndStr}`;

                document.getElementById('date-display').innerHTML = 
                    `YAHRZEITS FOR THE WEEK OF:<br>
                     ${dateRangeEn}
                     <span class="hebrew-date-line">${dateRangeHeb}</span>`;

                let allPlaques = [];
                for (let i = 0; i < 7; i++) {
                    let checkDate = new Date(startOfWeek);
                    checkDate.setDate(startOfWeek.getDate() + i);
                    
                    const hDate = new hebcal.HDate(checkDate);
                    const hMonth = hDate.getMonthName();
                    const hDay = hDate.getDate();

                    const todaysNames = data.filter(row => {
                        const info = extractHebrewInfo(row);
                        if (!info.day || !info.month) return false;
                        return info.day === hDay && isMonthMatch(info.month, hMonth);
                    });
                    
                    todaysNames.sort((a, b) => {
                        const nameA = (a.EnglishName || "").trim().toLowerCase();
                        const nameB = (b.EnglishName || "").trim().toLowerCase();
                        return nameA.localeCompare(nameB);
                    });

                    todaysNames.forEach(p => {
                        const info = extractHebrewInfo(p);
                        let baseHebDate = `${rowToHebrew(hDay)} ${translateMonth(hMonth)}`;
                        
                        if (info.year) {
                            baseHebDate += ` ${yearToHebrew(info.year)}`;
                        }
                        
                        p.calcHebDate = baseHebDate;
                        allPlaques.push(p);
                    });
                }

                const viewport = document.getElementById('viewport');
                viewport.innerHTML = ''; 

                if (allPlaques.length === 0) {
                    viewport.innerHTML = '<div style="color:#d4af37; text-align:center; margin-top: 50px;">No Yahrzeits found for this week.</div>';
                    return;
                }

                const itemsPerPage = ROWS_PER_PAGE * COLS_PER_PAGE;
                let currentPageDiv = null;

                allPlaques.forEach((person, index) => {
                    if (index % itemsPerPage === 0) {
                        currentPageDiv = document.createElement('div');
                        currentPageDiv.className = 'page-container';
                        viewport.appendChild(currentPageDiv);
                    }
                    createPlaque(person, person.calcHebDate, currentPageDiv);
                });

                setTimeout(startPageScroll, 1500);

            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        function extractHebrewInfo(row) {
            let rDay = null, rMonth = null, rYear = null;
            
            if (row.HebrewDate) {
                let parts = row.HebrewDate.trim().split(/\s+/);
                if (parts.length >= 2) {
                    rDay = parseInt(parts[0]);
                    
                    let lastPart = parts[parts.length - 1];
                    if (!isNaN(lastPart) && lastPart.length === 4) {
                        rYear = parts.pop(); 
                    }
                    rMonth = parts.slice(1).join(' '); 
                }
            } else {
                rDay = parseInt(row.HebrewDay);
                rMonth = row.HebrewMonth ? row.HebrewMonth.trim() : null;
                rYear = row.HebrewYear ? row.HebrewYear.trim() : null;
            }
            return { day: rDay, month: rMonth, year: rYear };
        }

        function calculateLayout() {
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            const safeContainerWidth = winHeight * SAFE_SCALE;
            const safeContainerHeight = winWidth * SAFE_SCALE;

            document.documentElement.style.setProperty('--safe-width', `${safeContainerHeight}px`);
            document.documentElement.style.setProperty('--safe-height', `${safeContainerWidth}px`);
            document.documentElement.style.setProperty('--cols', COLS_PER_PAGE);
            document.documentElement.style.setProperty('--rows', ROWS_PER_PAGE);

            const verticalHeight = Math.max(safeContainerWidth, safeContainerHeight);
            const gridHeight = verticalHeight - 100; 
            const totalGapSpace = 15 * (ROWS_PER_PAGE - 1);
            const rowHeight = (gridHeight - totalGapSpace) / ROWS_PER_PAGE;
            
            // Re-balanced base multiplier to give a solid starting point for the new larger em values
            const dynamicFontSize = Math.max(11, rowHeight * 0.12);
            document.documentElement.style.setProperty('--plaque-font-size', `${dynamicFontSize}px`);
        }

        function startPageScroll() {
            const viewport = document.getElementById('viewport');
            const pages = document.querySelectorAll('.page-container');
            
            if (pages.length <= 1) return;

            const PAGE_DELAY = 15000; 

            scrollInterval = setInterval(() => {
                pageIndex++;
                if (pageIndex >= pages.length) {
                    pageIndex = 0;
                }
                pages[pageIndex].scrollIntoView({ behavior: 'smooth' });
            }, PAGE_DELAY);
        }

        function showError(msg) {
            const vp = document.getElementById('viewport');
            vp.innerHTML = `<div class="error-message"><strong>ERROR:</strong><br>${msg}</div>`;
        }

        function createPlaque(person, hebrewDateStr, container) {
            const plaque = document.createElement('div');
            plaque.className = 'plaque';
            
            const hebrewName = person.HebrewName || "";
            const englishName = person.EnglishName || ""; 
            const englishDate = person.EnglishDate || ""; 

            plaque.innerHTML = `
                <div class="plaque-zone-top">
                    <div class="hebrew-name">${hebrewName}</div>
                </div>
                <div class="plaque-zone-mid">
                    <div class="english-name">${englishName}</div>
                </div>
                <div class="plaque-zone-bot">
                    <div class="footer-text date-left">${englishDate}</div>
                    <div class="footer-text date-right">${hebrewDateStr}</div>
                </div>
            `;
            container.appendChild(plaque);
        }

        function isMonthMatch(sheetMonth, hebcalMonth) {
            if (!sheetMonth) return false;
            
            let sMonth = sheetMonth.toLowerCase();
            if (sMonth === 'shevat') sMonth = "sh'vat";
            if (sMonth === 'tammuz') sMonth = "tamuz";
            if (sMonth === 'teves') sMonth = "tevet";

            let hMonth = hebcalMonth.toLowerCase();
            
            return hMonth.includes(sMonth) || sMonth.includes(hMonth);
        }
        
        function rowToHebrew(num) {
            const gematria = ["","א","ב","ג","ד","ה","ו","ז","ח","ט","י","יא","יב","יג","יד","טו","טז","יז","יח","יט","כ","כא","כב","כג","כד","כה","כו","כז","כח","כט","ל"];
            if (gematria[num]) {
                return gematria[num] + "'"; 
            }
            return num;
        }

        function yearToHebrew(year) {
            let y = parseInt(year);
            if (isNaN(y)) return year; 
            
            if (y >= 5000) y -= 5000; 
            
            let result = "";
            let hundreds = Math.floor(y / 100);
            let remainder = y % 100;
            
            while (hundreds >= 4) {
                result += "ת";
                hundreds -= 4;
            }
            const hundMap = ["", "ק", "ר", "ש"];
            result += hundMap[hundreds];
            
            if (remainder === 15) {
                result += "טו";
            } else if (remainder === 16) {
                result += "טז";
            } else {
                let tens = Math.floor(remainder / 10);
                let units = remainder % 10;
                const tensMap = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
                const unitsMap = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
                result += tensMap[tens];
                result += unitsMap[units];
            }
            
            if (result.length > 1) {
                result = result.slice(0, -1) + '"' + result.slice(-1);
            } else if (result.length === 1) {
                result += "'";
            }
            
            return result;
        }
        
        function translateMonth(englishMonth) {
            const map = {
                'Nisan': 'ניסן', 'Iyyar': 'אייר', 'Sivan': 'סיון', 'Tamuz': 'תמוז', 'Tammuz': 'תמוז', 'Av': 'אב', 'Elul': 'אלול',
                'Tishrei': 'תשרי', 'Cheshvan': 'חשון', 'Kislev': 'כסלו', 'Tevet': 'טבת', 'Teves': 'טבת', 'Sh\'vat': 'שבט', 'Shevat': 'שבט',
                'Adar': 'אדר', 'Adar I': 'אדר א', 'Adar II': 'אדר ב'
            };
            return map[englishMonth] || englishMonth;
        }

        window.addEventListener('resize', calculateLayout);
        
        window.onload = () => {
            initBoard(); 
            updateClock(); 
            setInterval(updateClock, 1000); 
            setInterval(initBoard, 1000 * 60 * 60 * 4); 
        };
    </script>
</body>
</html>
